name: Workout Tracker

on:
  push:
    paths: ['workout-tracker/**', '.github/workflows/workout-tracker.yml']
  pull_request:
    paths: ['workout-tracker/**', '.github/workflows/workout-tracker.yml']
  workflow_dispatch:

permissions:
  contents: read

# Tests and builds only. Publishing to GitHub Pages is in pages.yml (both apps share one site).
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workout-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workout-tracker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Optional. Set both under Settings > Secrets and variables > Actions > Variables
          # to turn on Google sign-in and sync (see workout-tracker/SYNC_SETUP.md).
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
