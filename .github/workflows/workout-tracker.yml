name: Workout Tracker

on:
  push:
    paths: ['workout-tracker/**', '.github/workflows/workout-tracker.yml']
  pull_request:
    paths: ['workout-tracker/**', '.github/workflows/workout-tracker.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workout-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workout-tracker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: workout-tracker/dist

  # Publishes to GitHub Pages only from the default branch.
  # One-time setup: repo Settings > Pages > Source: "GitHub Actions".
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
